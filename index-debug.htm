<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Capture all errors
      window.errors = [];
      window.addEventListener('error', function(e) {
        window.errors.push({
          message: e.message,
          source: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error ? e.error.toString() : null,
          stack: e.error ? e.error.stack : null
        });
        console.error('CAPTURED ERROR:', e.message, e.filename, e.lineno);
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        window.errors.push({
          type: 'unhandledRejection',
          reason: e.reason ? e.reason.toString() : null
        });
        console.error('UNHANDLED REJECTION:', e.reason);
      });
      
      console.log('Error handlers installed');
    </script>
    
    <script src="p5.min.js"></script>
    <script src="p5.sound.min.js"></script>
    <script src="p5.speech.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
    <script src="sketch.js"></script>
    <script src="classes.js"></script>
    <script src="aliens.js"></script>
    <script src="gamestate.js"></script>
    <script src="missions.js"></script>
    <script src="weather.js"></script>
    <script src="narrative.js"></script>
    <script src="boss.js"></script>
    <script>
      // After all scripts loaded
      console.log('All scripts loaded');
      console.log('Errors captured:', window.errors);
      console.log('p5 defined:', typeof p5);
      console.log('setup defined:', typeof setup);
      console.log('draw defined:', typeof draw);
    </script>
  </body>
</html>
